<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A shared place for Trigg family gift ideas.">
  <title>Trigg Family Wishlist</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap top-inner">
      <a href="#home" class="brand"><img class="brand-icon" src="favicon.svg" width="38" height="38" alt="">Trigg Family Wishlist</a>
      <button class="small-button" data-action="logout" id="sign-out" hidden>Sign out</button>
    </div>
  </header>
  <main class="wrap" id="app"><p class="loading" role="status">Loading family wishlists…</p></main>
  <dialog id="editor" aria-labelledby="editor-title"></dialog>
</body>
</html>
