<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A shared place for Trigg family gift ideas.">
<title>Trigg Family Wishlist</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="wrap top-inner">
    <a href="#" class="brand"><img class="brand-icon" src="/favicon.svg" width="38" height="38" alt="">Trigg Family Wishlist</a>
    <button class="small-button" id="header-add" data-form="person" hidden>＋ Add person</button>
  </div>
</header>
<main class="wrap">
  <section class="hero" aria-labelledby="page-title">
    <div class="hero-text">
      <h1 id="page-title">Family wishlists</h1>
      <p>Find gift ideas for the people you love.</p>
    </div>
    <div class="hero-art" aria-hidden="true">
      <div class="halo"></div>
      <span class="spark spark-one">✦</span><span class="spark spark-two">✧</span><span class="spark spark-three">✦</span>
      <div class="parcel parcel-back"><i></i><b></b></div><div class="parcel parcel-front"><i></i><b></b></div>
    </div>
  </section>
  <div id="app"><p class="loading" role="status">Loading family wishlists…</p></div>
  <noscript>Enable JavaScript to use the family wishlists.</noscript>
</main>
<dialog id="editor" aria-labelledby="editor-title"></dialog>
</body>
</html>
